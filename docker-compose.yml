# Local dev/e2e infrastructure for Let's Park. See doc/environment.md for how
# to run this and how it relates to running apps/api and apps/web directly
# via `nx serve`/`nx dev` (not through Docker, for this phase).
#
# Reads its variables from `.env` at the repo root — copy `.env.example` to
# `.env` before running any of this (`docker compose config` will otherwise
# substitute empty strings, which is still valid YAML but not what you want).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # OIDC issuer for dev/e2e. AUTH_OKTA_ISSUER=http://localhost:8080/default
  # points here — dev, e2e and production all run the exact same auth code,
  # only this issuer URL differs (see doc/decision/0008-*). No JSON_CONFIG
  # is mounted: the server's built-in "default" issuer, reachable at
  # http://localhost:8080/default/.well-known/openid-configuration, is
  # enough for this phase.
  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:latest
    restart: unless-stopped
    ports:
      - '8080:8080'

  # DB admin UI — dev convenience only, never started in production.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: ['dev']
    ports:
      - '8081:8080'
    depends_on:
      postgres:
        condition: service_healthy

  # --- Placeholders -----------------------------------------------------
  # apps/web and apps/api do not have production Dockerfiles yet — those are
  # built in Task 29. These two entries only sketch the eventual compose
  # topology ahead of time (build context, port mapping, dependency order);
  # the `dockerfile:` paths below do not exist yet. Both are gated behind the
  # "app" profile precisely so a plain `docker compose up` (or
  # `docker compose --profile dev up`) never tries to build them before
  # Task 29 lands. Until then, run the apps on the host via
  # `nx serve api` / `nx run web:dev`.
  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile # created in Task 29
    restart: unless-stopped
    env_file: .env
    ports:
      - '3001:3000'
    depends_on:
      - api

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile # created in Task 29
    restart: unless-stopped
    env_file: .env
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      mock-oauth2-server:
        condition: service_started

volumes:
  postgres-data:
